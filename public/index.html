<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eldritch Game Studio</title>
  <meta name="description" content="Independent game studio crafting strange worlds and the tools to bring them to life.">
  <meta name="theme-color" content="#0b0909">
  <meta name="color-scheme" content="dark">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Eldritch Game Studio">
  <meta property="og:title" content="Eldritch Game Studio">
  <meta property="og:description" content="Independent game studio crafting strange worlds and the tools to bring them to life.">
  <meta property="og:url" content="https://eldritch.studio/">
  <meta property="og:image" content="https://eldritch.studio/assets/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="640">
  <meta property="og:image:alt" content="Eldritch Game Studio emblem and wordmark">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Eldritch Game Studio">
  <meta name="twitter:description" content="Independent game studio crafting strange worlds and the tools to bring them to life.">
  <meta name="twitter:image" content="https://eldritch.studio/assets/og-image.png">
  <link rel="canonical" href="https://eldritch.studio/">
  <link rel="icon" href="assets/emblem.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/cinzel-decorative-900.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="splash">
    <header class="identity">
      <img class="emblem" src="assets/emblem.svg" width="775" height="700" alt="Eldritch Game Studio emblem: a glowing red slit-pupil eye ringed by curling tentacles inside an arch">
      <div class="wordmark">
        <h1>Eldritch</h1>
        <div class="studio-line" aria-label="Game Studio">
          <span class="rule" aria-hidden="true"></span>
          <span class="diamond" aria-hidden="true"></span>
          <span class="studio-name">Game Studio</span>
          <span class="diamond" aria-hidden="true"></span>
          <span class="rule" aria-hidden="true"></span>
        </div>
      </div>
    </header>

    <section class="projects" aria-labelledby="projects-title">
      <h2 id="projects-title">Free and open-source assets for Godot</h2>
      <div class="project-links">
        <a class="project" href="https://store.godotengine.org/asset/eldritch-studio/necronomidom/">
          <span class="project-art" aria-hidden="true">
            <img src="assets/projects/necronomidom.webp" width="1024" height="512" alt="">
          </span>
          <span class="project-copy">
            <span class="project-name">NecronomiDOM</span>
            <span class="project-label">Native HTML and CSS interfaces for Godot</span>
            <span class="project-cta">View on Godot Asset Store <span aria-hidden="true">→</span></span>
          </span>
        </a>
        <a class="project" href="https://store.godotengine.org/asset/eldritch-studio/dirge/">
          <span class="project-art" aria-hidden="true">
            <img src="assets/projects/dirge.webp" width="1024" height="512" alt="">
          </span>
          <span class="project-copy">
            <span class="project-name">Dirge</span>
            <span class="project-label">Adaptive audio authoring for Godot 4 .NET</span>
            <span class="project-cta">View on Godot Asset Store <span aria-hidden="true">→</span></span>
          </span>
        </a>
      </div>
    </section>

    <footer class="studio-footer">
      <a href="https://github.com/Eldritch-Game-Studio">Eldritch Game Studio on GitHub <span aria-hidden="true">→</span></a>
    </footer>
  </main>
</body>
</html>
