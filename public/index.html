<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eldritch Game Studio</title>
  <meta name="description" content="Eldritch Game Studio creates tools and assets for Godot.">
  <meta name="theme-color" content="#0b0909">
  <meta name="color-scheme" content="dark">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Eldritch Game Studio">
  <meta property="og:description" content="Tools and assets for Godot from Eldritch Game Studio.">
  <meta property="og:url" content="https://eldritch.studio/">
  <link rel="canonical" href="https://eldritch.studio/">
  <link rel="icon" href="assets/emblem.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/cinzel-decorative-900.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="splash">
    <header class="identity">
      <img class="emblem" src="assets/emblem.svg" width="775" height="700" alt="Eldritch Game Studio emblem: a glowing red slit-pupil eye ringed by curling tentacles inside an arch">
      <div class="wordmark">
        <h1>Eldritch</h1>
        <div class="studio-line" aria-label="Game Studio">
          <span class="rule" aria-hidden="true"></span>
          <span class="diamond" aria-hidden="true"></span>
          <span class="studio-name">Game Studio</span>
          <span class="diamond" aria-hidden="true"></span>
          <span class="rule" aria-hidden="true"></span>
        </div>
      </div>
    </header>

    <section class="projects" aria-labelledby="projects-title">
      <h2 id="projects-title">Godot projects</h2>
      <div class="project-links">
        <a class="project" href="https://store.godotengine.org/asset/eldritch-studio/necronomidom/">
          <span class="project-name">NecronomiDOM</span>
          <span class="project-label">Native HTML and CSS interfaces for Godot</span>
          <span class="project-url">store.godotengine.org/asset/eldritch-studio/necronomidom/</span>
        </a>
        <a class="project" href="https://store.godotengine.org/asset/eldritch-studio/dirge/">
          <span class="project-name">Dirge</span>
          <span class="project-label">Godot Asset Store project</span>
          <span class="project-url">store.godotengine.org/asset/eldritch-studio/dirge/</span>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
